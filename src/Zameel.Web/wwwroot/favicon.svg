<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5A3" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with midnight indigo -->
  <rect width="128" height="128" rx="28" fill="#13112B" />

  <!-- Top Golden Diamond Dot (نقطة حرف الزاي / Campus Meeting Point) -->
  <path d="M 64 16 L 73 25 L 64 34 L 55 25 Z" fill="#FFD700" filter="url(#glow)" />

  <!-- Upper Loop: Electric Mint to Cyan (حرف ز علوي متصل) -->
  <path d="M 34 46 C 34 38, 48 38, 64 38 C 82 38, 94 45, 94 56 C 94 65, 84 72, 70 78 L 44 90 C 37 93, 34 98, 34 104 C 34 104, 34 104, 34 104" 
        fill="none" stroke="url(#mintGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lower Loop: Solar Saffron Amber (حرف Z متقاطع ومتبادل يد بيد) -->
  <path d="M 94 82 C 94 90, 80 90, 64 90 C 46 90, 34 83, 34 72 C 34 63, 44 56, 58 50 L 84 38 C 91 35, 94 30, 94 24" 
        fill="none" stroke="url(#saffronGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Exchange Interlock Accent -->
  <circle cx="64" cy="64" r="5" fill="#00E5A3" />
</svg>
